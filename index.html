<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCRUNTEGAL Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
padding:30px;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
width:100%;
max-width:900px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border-radius:25px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,0.4);
border:1px solid rgba(255,255,255,0.15);
}

.header{
background:linear-gradient(90deg,#00c853,#00ff95);
padding:45px;
text-align:center;
}

.header h1{
font-size:50px;
font-weight:800;
letter-spacing:2px;
}

.header p{
margin-top:10px;
font-size:18px;
font-weight:500;
}

.content{
padding:35px;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#00ff95;
border-left:5px solid #00ff95;
padding-left:12px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:8px;
font-weight:500;
}

.input-group input,
.input-group textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:rgba(255,255,255,0.12);
color:white;
font-size:15px;
outline:none;
}

.input-group input[type="file"]{
padding:10px;
cursor:pointer;
}

textarea{
min-height:100px;
resize:vertical;
}

input::placeholder,
textarea::placeholder{
color:rgba(255,255,255,0.6);
}

.radio-group{
display:flex;
flex-wrap:wrap;
gap:15px;
margin-top:10px;
}

.radio-item{
background:rgba(255,255,255,0.1);
padding:12px 18px;
border-radius:12px;
cursor:pointer;
}

.submit-btn{
width:100%;
padding:18px;
margin-top:30px;
border:none;
border-radius:15px;
background:linear-gradient(90deg,#00c853,#00ff95);
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,255,149,0.3);
transition:0.3s;
}

.submit-btn:hover{
transform:translateY(-3px);
}

.qris-box{
margin-top:20px;
text-align:center;
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:20px;
}

.preview-img{
width:250px;
max-width:100%;
margin-top:20px;
border-radius:15px;
display:none;
background:white;
padding:10px;
}

.footer{
text-align:center;
padding:25px;
font-size:14px;
background:rgba(255,255,255,0.05);
color:rgba(255,255,255,0.7);
}

@media(max-width:768px){

.header h1{
font-size:35px;
}

.content{
padding:20px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>MCRUNTEGAL</h1>
<p>Lari Bersama, Raih Prestasi, Ciptakan Inspirasi</p>
</div>

<div class="content">

<div class="section-title">
Data Peserta
</div>

<div class="grid">

<div class="input-group">
<label>Nama Lengkap</label>
<input type="text" placeholder="Masukkan nama lengkap">
</div>

<div class="input-group">
<label>Email</label>
<input type="email" placeholder="Masukkan email aktif">
</div>

<div class="input-group">
<label>WhatsApp</label>
<input type="tel" placeholder="08xxxxxxxxxx">
</div>

<div class="input-group">
<label>Tanggal Lahir</label>
<input type="date">
</div>

</div>

<div class="input-group">
<label>Alamat Lengkap</label>
<textarea placeholder="Masukkan alamat lengkap"></textarea>
</div>

<div class="input-group">
<label>Jenis Kelamin</label>

<div class="radio-group">

<label class="radio-item">
<input type="radio" name="jk">
Laki-laki
</label>

<label class="radio-item">
<input type="radio" name="jk">
Perempuan
</label>

</div>

</div>

<div class="section-title">
Kategori Lari
</div>

<div class="radio-group">

<label class="radio-item">
<input type="radio" name="kategori">
3KM Fun Run
</label>

<label class="radio-item">
<input type="radio" name="kategori">
5KM Fun Run
</label>

<label class="radio-item">
<input type="radio" name="kategori">
10KM Competitive
</label>

</div>

<div class="section-title" style="margin-top:35px;">
Upload QRIS Pembayaran
</div>

<div class="qris-box">

<input type="file" id="uploadQR" accept="image/*">

<img id="previewQR" class="preview-img">

<p style="margin-top:15px;">
Upload gambar QRIS pembayaran
</p>

</div>

<div class="section-title" style="margin-top:35px;">
Upload Bukti Pembayaran
</div>

<div class="input-group">

<label>Upload Screenshot Pembayaran</label>

<input type="file" id="uploadBukti" accept="image/*">

<img id="previewBukti" class="preview-img">

</div>

<button class="submit-btn">
DAFTAR SEKARANG
</button>

</div>

<div class="footer">
© 2025 MCRUNTEGAL • All Rights Reserved
</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function(){

// ====================
// QRIS PREVIEW
// ====================

const uploadQR = document.getElementById("uploadQR");
const previewQR = document.getElementById("previewQR");

uploadQR.addEventListener("change", function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

previewQR.src = e.target.result;
previewQR.style.display = "block";

}

reader.readAsDataURL(file);

}

});

// ====================
// BUKTI PEMBAYARAN
// ====================

const uploadBukti = document.getElementById("uploadBukti");
const previewBukti = document.getElementById("previewBukti");

uploadBukti.addEventListener("change", function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){

previewBukti.src = e.target.result;
previewBukti.style.display = "block";

}

reader.readAsDataURL(file);

}

});

});

</script>

</body>
</html>
